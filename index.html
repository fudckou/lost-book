<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>失物之书 · 飞翔的荷兰人号</title>
    <style>
        /* 样式与上一版完全相同，此处省略以节省篇幅，实际使用时需完整保留 */
        /* 但为代码完整性，这里放置简写，实际复制时请使用完整样式 */
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            width:100vw; height:100vh; overflow:hidden;
            background:#0a0e1a;
            display:flex; justify-content:center; align-items:center;
            font-family:'Georgia','Times New Roman',serif;
            touch-action:manipulation;
        }
        #container {
            position:relative; width:100%; height:100%;
            max-width:480px; max-height:860px;
            background:radial-gradient(ellipse at center,#1b2540 0%,#0a0e1a 100%);
            overflow:hidden;
            display:flex; justify-content:center; align-items:center;
            cursor:pointer;
            touch-action:manipulation;
        }
        #bg-water {
            position:absolute; bottom:0; left:0; width:100%; height:40%;
            background:linear-gradient(180deg,transparent,rgba(10,30,60,0.6));
            pointer-events:none; z-index:0;
        }
        #book-wrapper {
            position:relative; z-index:1;
            width:88%; max-width:400px;
            aspect-ratio:0.72/1;
            perspective:1600px;
        }
        #book {
            position:relative; width:100%; height:100%;
            transform-style:preserve-3d;
            transition:transform 0.7s cubic-bezier(0.3,0.2,0.2,0.8);
            transform:rotateY(0deg);
            border-radius:4px 14px 14px 4px;
        }
        #book.flipped { transform:rotateY(180deg); }
        #front {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background:linear-gradient(145deg,#4a3728,#2d1f14);
            box-shadow:-10px 10px 40px rgba(0,0,0,0.9), inset -2px 0 30px rgba(0,0,0,0.3), inset 0 0 80px rgba(180,140,100,0.06);
            backface-visibility:hidden;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            padding:20px;
            border:2px solid #6a4f38;
            z-index:2;
        }
        #front::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background-image:radial-gradient(ellipse at 30% 40%,rgba(200,170,130,0.05) 0%,transparent 60%),
                repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px);
            pointer-events:none;
        }
        #front .corner {
            position:absolute; width:26px; height:26px;
            border:2px solid #b89870; opacity:0.5;
        }
        #front .corner-tl { top:10px; left:10px; border-right:none; border-bottom:none; }
        #front .corner-tr { top:10px; right:10px; border-left:none; border-bottom:none; }
        #front .corner-bl { bottom:10px; left:10px; border-right:none; border-top:none; }
        #front .corner-br { bottom:10px; right:10px; border-left:none; border-top:none; }
        #front .spine-line {
            position:absolute; left:14px; top:15%; width:2px; height:70%;
            background:linear-gradient(180deg,transparent,rgba(180,150,110,0.2),transparent);
        }
        #front .title {
            font-size:2.6rem; font-weight:bold; color:#d4b48a;
            text-shadow:0 0 40px rgba(180,150,110,0.15),0 2px 4px rgba(0,0,0,0.8);
            letter-spacing:14px; font-family:'Georgia',serif;
            margin-bottom:4px; text-align:center;
        }
        #front .subtitle {
            font-size:0.75rem; color:#8a7a6a; letter-spacing:6px;
            text-shadow:0 1px 3px rgba(0,0,0,0.6); font-style:italic;
            border-top:1px solid rgba(180,150,110,0.15);
            padding-top:12px; margin-top:4px;
        }
        #front .ornament {
            font-size:3.2rem; color:rgba(180,150,110,0.2);
            margin:6px 0; letter-spacing:16px;
        }
        #front .hint {
            position:absolute; bottom:22px; left:0; width:100%; text-align:center;
            font-size:0.65rem; color:rgba(180,170,160,0.25);
            letter-spacing:2px; animation:pulseHint 3s infinite;
        }
        @keyframes pulseHint { 0%,100%{opacity:0.15;} 50%{opacity:0.6;} }
        #version {
            position: absolute;
            bottom: 62px;
            right: 16px;
            font-size: 0.55rem;
            color: rgba(180,170,160,0.2);
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 3;
        }
        #back {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background:linear-gradient(170deg,#f5ede0,#e8dcc8);
            box-shadow:inset 0 0 60px rgba(160,130,100,0.15);
            backface-visibility:hidden;
            transform:rotateY(180deg);
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            padding:24px 18px;
            border:1px solid #c8b898;
            overflow:hidden;
        }
        #back::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background-image:radial-gradient(ellipse at 20% 30%,rgba(200,170,130,0.08) 0%,transparent 50%),
                repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(180,160,130,0.03) 3px,rgba(180,160,130,0.03) 4px);
            pointer-events:none;
        }
        #back .icon,
        #back .answer {
            opacity: 0;
            transform: scale(0.8) translateY(10px);
        }
        #back .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        #back .answer {
            font-size: 1.3rem;
            line-height: 1.9;
            color: #2d241a;
            text-align: center;
            font-family: 'Georgia', serif;
            letter-spacing: 0.5px;
            padding: 0 6px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
        #back .page-number {
            position:absolute; bottom:16px; right:22px;
            font-size:0.65rem; color:#b0a090;
            letter-spacing:2px; font-style:italic;
            opacity:0.5;
        }
        #back::after {
            content:''; position:absolute; bottom:0; left:0; width:100%; height:6px;
            background:linear-gradient(0deg,#4a3728,transparent);
            border-radius:0 0 4px 14px; opacity:0.3;
        }
        #back.flip .icon {
            animation: iconFlip 0.5s ease forwards;
        }
        #back.flip .answer {
            animation: textFlip 0.6s ease forwards;
        }
        @keyframes iconFlip {
            0%   { opacity: 0; transform: scale(0.7) rotate(-10deg); }
            60%  { opacity: 0.6; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
        }
        @keyframes textFlip {
            0%   { opacity: 0; transform: translateY(15px) scale(0.9); }
            70%  { opacity: 0.5; transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        #egg-float {
            position:absolute; top:50%; left:50%;
            transform:translate(-50%,-50%) scale(0.9);
            z-index:20;
            color:#d4c4b0;
            font-size:1.4rem; font-family:'Georgia',serif; font-style:italic;
            letter-spacing:2px;
            text-shadow:0 0 60px rgba(180,150,110,0.3),0 4px 20px rgba(0,0,0,0.6);
            text-align:center;
            padding:20px 30px;
            background:rgba(10,14,26,0.5);
            backdrop-filter:blur(6px);
            border-radius:8px;
            border:1px solid rgba(180,150,110,0.2);
            opacity:0; pointer-events:none;
            width:80%; max-width:300px; line-height:1.6;
        }
        #egg-float .sub {
            display:block; font-size:0.7rem; color:#6a5a4a;
            margin-top:12px; letter-spacing:4px; font-style:normal;
        }
        #status {
            position:absolute; bottom:24px; left:0; width:100%; text-align:center;
            z-index:5; font-size:0.6rem; color:rgba(180,170,160,0.2);
            letter-spacing:3px; pointer-events:none;
            transition: color 0.3s;
        }
        #status span {
            background:rgba(10,14,26,0.3);
            padding:4px 14px; border-radius:20px;
            backdrop-filter:blur(2px);
            display: inline-block;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #status.error span {
            color: #d4a0a0;
            border: 1px solid rgba(200,80,80,0.2);
        }
        #status.success span {
            color: #a0d4a0;
            border: 1px solid rgba(80,200,80,0.2);
        }
        #voice-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,14,26,0.75);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px 20px;
            border-radius: 4px 14px 14px 4px;
            animation: overlayIn 0.4s ease;
        }
        @keyframes overlayIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        #voice-overlay.show { display: flex; }
        #voice-overlay .title {
            color: #d4c4b0;
            font-size: 1.6rem;
            font-family: 'Georgia', serif;
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(180,150,110,0.2);
        }
        #voice-overlay .sub {
            color: #8a7a6a;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-style: italic;
        }
        #voice-input-area {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        #voice-textarea {
            width: 100%;
            height: 100px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(180,150,110,0.25);
            border-radius: 12px;
            color: #f0e6d0;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            resize: none;
            outline: none;
            transition: border 0.3s;
            line-height: 1.6;
        }
        #voice-textarea:focus { border-color: rgba(180,150,110,0.6); }
        #voice-textarea::placeholder {
            color: rgba(180,170,160,0.3);
            font-style: italic;
        }
        #voice-controls {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .voice-btn {
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(180,150,110,0.3);
            background: rgba(10,14,26,0.4);
            color: #d4c4b0;
            font-size: 0.9rem;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .voice-btn:hover {
            background: rgba(180,150,110,0.15);
            border-color: rgba(180,150,110,0.5);
        }
        .voice-btn:active { transform: scale(0.95); }
        .voice-btn.mic {
            border-radius: 50%;
            width: 54px;
            height: 54px;
            justify-content: center;
            font-size: 1.6rem;
            padding: 0;
        }
        .voice-btn.mic.listening {
            background: rgba(200,80,80,0.3);
            border-color: rgba(200,80,80,0.6);
            animation: pulseMic 1s infinite;
        }
        @keyframes pulseMic {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,80,80,0.4); }
            50% { box-shadow: 0 0 20px 10px rgba(200,80,80,0); }
        }
        #listening-text {
            color: rgba(180,170,160,0.6);
            font-size: 1.1rem;
            letter-spacing: 4px;
            margin-top: 6px;
            font-style: italic;
            animation: waveText 1.5s ease-in-out infinite;
            display: none;
        }
        #listening-text.show { display: block; }
        @keyframes waveText {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }
        .voice-close {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 1.8rem;
            color: rgba(180,170,160,0.3);
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-family: 'Georgia', serif;
        }
        .voice-close:hover {
            color: rgba(180,170,160,0.7);
            transform: rotate(90deg);
        }
        @media (max-width:380px) {
            #book-wrapper { max-width:300px; }
            #front .title { font-size:2rem; letter-spacing:10px; }
            #back .answer { font-size:1.1rem; }
            #back .icon { font-size:2.2rem; }
            #egg-float { font-size:1.1rem; width:85%; }
            #version { font-size:0.5rem; bottom:52px; right:12px; }
            #status span { font-size:0.5rem; padding:2px 10px; }
        }
        @media (orientation:landscape) and (max-height:500px) {
            #book-wrapper { max-width:220px; }
            #front .title { font-size:1.6rem; letter-spacing:6px; }
            #back .answer { font-size:0.95rem; }
            #back .icon { font-size:2rem; }
            #egg-float { font-size:1rem; width:70%; }
            #version { font-size:0.45rem; bottom:40px; right:10px; }
            #status span { font-size:0.45rem; padding:2px 8px; }
        }
    </style>
</head>
<body>

<div id="container">
    <div id="bg-water"></div>
    <div id="book-wrapper">
        <div id="book">
            <div id="front">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="spine-line"></div>
                <div class="ornament">⚓</div>
                <div class="title">失物之书</div>
                <div class="subtitle">— 寻回遗失之物 —</div>
                <div class="hint">✦ 轻触书封，倾诉心声 ✦</div>
                <div id="version">v2.1.0</div>
            </div>
            <div id="back">
                <div class="icon" id="answer-icon">⛵</div>
                <div class="answer" id="answer-text">深渊在凝视你</div>
                <div class="page-number" id="page-num">— 第 ? 页 —</div>
            </div>
        </div>
    </div>
    <div id="egg-float">
        <span id="egg-text">潮水带走了这一页</span>
        <span class="sub">✦ 书已合 ✦</span>
    </div>
    <div id="status"><span id="status-text">⏳ 正在加载...</span></div>

    <div id="voice-overlay">
        <button class="voice-close" id="voice-close">✕</button>
        <div class="title">🌊 向大海倾诉</div>
        <div class="sub">说出或写下你的心声，命运将为你翻开一页</div>
        <div id="voice-input-area">
            <textarea id="voice-textarea" placeholder="在此写下你的困惑、愿望或心事……"></textarea>
            <div id="listening-text">🌊 大海正在倾听...</div>
            <div id="voice-controls">
                <button class="voice-btn" id="voice-submit">✦ 聆听</button>
                <button class="voice-btn mic" id="voice-mic" title="点击说话">🎤</button>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"
        }
    }
</script>
<script type="module">
    // ================================================================
    // 版本号
    // ================================================================
    const APP_VERSION = 'v2.1.0';

    // ================================================================
    // 数据（140条答案，与之前一致）
    // ================================================================
    const BASE_ANSWERS = [
        "浓雾终将散开，但别急。","扬起你的主帆，风会来。","深渊正在注视着你，别回头。",
        "等待满月之夜，那时门会打开。","你的心脏还在跳动，虽然它已冰冷。",

    const METAPHOR_ANSWERS = [
        "今晚就此靠岸吧。","把锚抛向星光最暗的地方。","海风会替你关掉多余的帆。",

    function tokenizeAndExpand(text) {
        const segmenter = new Intl.Segmenter('zh-CN', { granularity: 'word' });
        const rawWords = [];
        for (let seg of segmenter.segment(text)) {
            if (seg.isWordLike) rawWords.push(seg.segment.trim());
        }
        const expanded = [];
        for (let w of rawWords) {
            expanded.push(w);
            if (SYNONYM_MAP[w]) {
                expanded.push(...SYNONYM_MAP[w]);
            }
        }
        return expanded;
    }

    function getFreqFromWords(words) {
        const freq = {};
        words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
        return freq;
    }

    function cosineSimilarity(freq1, freq2) {
        const keys = new Set([...Object.keys(freq1), ...Object.keys(freq2)]);
        let dot = 0, norm1 = 0, norm2 = 0;
        for (let key of keys) {
            const v1 = freq1[key] || 0;
            const v2 = freq2[key] || 0;
            dot += v1 * v2;
            norm1 += v1 * v1;
            norm2 += v2 * v2;
        }
        if (norm1 === 0 || norm2 === 0) return 0;
        return dot / (Math.sqrt(norm1) * Math.sqrt(norm2));
    }

    function getSynonymSortedIndices(query) {
        const expandedWords = tokenizeAndExpand(query);
        const userFreq = getFreqFromWords(expandedWords);
        if (expandedWords.length === 0) {
            return ANSWERS.map((_, i) => i).sort(() => Math.random() - 0.5);
        }
        const scores = ANSWERS.map((text, i) => {
            const words = [];
            const seg = new Intl.Segmenter('zh-CN', { granularity: 'word' });
            for (let s of seg.segment(text)) {
                if (s.isWordLike) words.push(s.segment.trim());
            }
            const freq = {};
            words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
            const score = cosineSimilarity(userFreq, freq);
            return { index: i, score };
        });
        scores.sort((a, b) => b.score - a.score);
        if (scores[0].score < 0.02) {
            const metaphorIndices = ANSWERS.map((_, i) => i).filter(i => i >= 100);
            const rest = scores.filter(s => s.index < 100).map(s => s.index);
            return [...metaphorIndices, ...rest];
        }
        return scores.map(s => s.index);
    }

    function playPageSound() {
        try {
            const ctx = getAudioCtx();
            const size = ctx.sampleRate * 0.10;
            const buf = ctx.createBuffer(1, size, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < size; i++) {
                const t = i / size;
                d[i] = (Math.random() * 2 - 1) * (1 - t) * 0.12 + Math.sin(i * 0.008) * (1 - t) * 0.03;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const gain = ctx.createGain();
            gain.gain.value = 0.35;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(ctx.currentTime);
        } catch (_) {}
    }
    function playCloseSound() {
        try {
            const ctx = getAudioCtx();
            const size = ctx.sampleRate * 0.25;
            const buf = ctx.createBuffer(1, size, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < size; i++) {
                const t = i / size;
                const decay = Math.exp(-t * 6);
                d[i] = (Math.random() * 2 - 1) * decay * 0.25 + Math.sin(i * 0.02) * decay * 0.08 + Math.sin(i * 0.05 + 0.5) * decay * 0.05;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const gain = ctx.createGain();
            gain.gain.value = 0.5;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(ctx.currentTime);
        } catch (_) {}
    }

    async function loadAI() {
        setStatus('⏳ 正在加载 AI 引擎...', '');
        try {
            // 使用国内镜像源
            const MODEL_URL = 'https://hf-mirror.com/Xenova/all-MiniLM-L6-v2';
            setStatus('📥 正在连接镜像服务器...', '');
            const { pipeline: pipelineFn } = await import('@xenova/transformers');
            setStatus('📥 模块加载成功，正在下载模型...', '');

            pipeline = await pipelineFn('feature-extraction', MODEL_URL, {
                progress_callback: (progress) => {
                    if (progress.status === 'downloading') {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        setStatus(`📥 下载模型 (${pct}%)...`, '');
                    } else if (progress.status === 'ready') {
                        setStatus('🧠 模型准备就绪', '');
                    }
                }
            });

            // 预计算向量
            setStatus('🧠 生成答案向量 (0%)...', '');
            const embeddings = [];
            for (let i = 0; i < ANSWERS.length; i++) {
                const result = await pipeline(ANSWERS[i], { pooling: 'mean', normalize: true });
                embeddings.push(result.data);
                if (i % 10 === 0) {
                    const pct = Math.round((i / ANSWERS.length) * 100);
                    setStatus(`🧠 生成向量 (${pct}%)...`, '');
                }
            }
            state.answerEmbeddings = embeddings;
            state.aiReady = true;
            setStatus('✅ AI 已就绪 (镜像源)', 'success');
            console.log('✅ AI 加载成功（使用镜像）');
            return true;
        } catch (err) {
            const errMsg = err.message || err.toString();
            setStatus(`❌ 加载失败: ${errMsg.substring(0, 40)}...`, 'error');
            console.error('AI 加载失败:', err);
            setTimeout(() => {
                setStatus('⚠️ 已切换到备用引擎 (同义词匹配)', 'error');
            }, 3000);
            return false;
        }
    }

    async function getAISortedIndices(query) {
        if (!state.aiReady || !pipeline) {
            return getSynonymSortedIndices(query);
        }
        try {
            const result = await pipeline(query, { pooling: 'mean', normalize: true });
            const queryEmbedding = result.data;
            const scores = [];
            for (let i = 0; i < state.answerEmbeddings.length; i++) {
                const emb = state.answerEmbeddings[i];
                let dot = 0;
                for (let j = 0; j < queryEmbedding.length; j++) {
                    dot += queryEmbedding[j] * emb[j];
                }
                scores.push({ index: i, score: dot });
            }
            scores.sort((a, b) => b.score - a.score);
            if (scores[0].score < 0.3) {
                const metaphorIndices = ANSWERS.map((_, i) => i).filter(i => i >= 100);
                const rest = scores.filter(s => s.index < 100).map(s => s.index);
                return [...metaphorIndices, ...rest];
            }
            return scores.map(s => s.index);
        } catch (err) {
            console.warn('AI 匹配失败，降级同义词:', err);
            return getSynonymSortedIndices(query);
        }
    }

    function turnNextAnswer() {
        if (state.isFlipping || state.isEggMode) return;
        if (!state.isBookOpen) return;
        if (!state.voiceSession.active) return;

        const nextPage = state.voiceSession.pageCount + 1;
        if (nextPage > state.eggTriggerThreshold) {
            triggerEgg();
            return;
        }

        state.voiceSession.currentIndex = (state.voiceSession.currentIndex + 1) % state.voiceSession.answerIndices.length;
        state.voiceSession.pageCount = nextPage;
        const ans = getCurrentAnswer();
        performTurn(
            () => updateBackContent(ans.text, ans.icon, ans.page),
            () => {
                statusText.textContent = `✦ 第 ${state.voiceSession.pageCount} 页 ✦`;
                frontHint.textContent = '✦ 翻页继续 ✦';

        );
    }

    function startEggAnimation(text) {
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        eggText.textContent = text;
        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-40%) scale(0.9)';
        void eggFloat.offsetHeight;
        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '1';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(1)';
        void eggFloat.offsetHeight;

        let startTime = null;
        const duration = 2800;
        const endY = -40;

        function animateEgg(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 1.5);
            const currentY = endY * eased;
            const currentOpacity = 1 - eased * 0.9;
            eggFloat.style.transition = 'none';
            eggFloat.style.transform = `translate(-50%, calc(-50% + ${currentY}px)) scale(${1 - eased * 0.05})`;
            eggFloat.style.opacity = currentOpacity;
            if (progress < 1) {
                state.eggAnimId = requestAnimationFrame(animateEgg);
            } else {
                eggFloat.style.opacity = '0';
                eggFloat.style.transform = 'translate(-50%, calc(-50% + 40px)) scale(0.9)';
                state.eggAnimId = null;
            }
        }
        state.eggAnimId = requestAnimationFrame(animateEgg);
    }

    function resetEggAnimation() {
        if (!state.isEggMode) return;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';
        startEggAnimation(state.eggMessage);
    }

    function exitEggMode() {
        if (!state.isEggMode) return;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';
        state.isEggMode = false;
        state.voiceSession.active = false;

        back.classList.remove('flip');
    }

    }

    function closeVoiceOverlay() {
        voiceOverlay.classList.remove('show');
        if (state.recognition) {
            state.recognition.abort();
            state.isListening = false;
            voiceMic.classList.remove('listening');
        }
        listeningText.classList.remove('show');
    }

    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('您的浏览器不支持语音识别，请使用最新版Chrome或Edge。');
            return null;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SR();
        recognition.lang = 'zh-CN';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {
            state.isListening = true;
            voiceMic.classList.add('listening');
            listeningText.classList.add('show');
            voiceTextarea.placeholder = '🎤 正在聆听...';
        };

        recognition.onresult = function(event) {
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    final += event.results[i][0].transcript;
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            if (final) {
                voiceTextarea.value = final;
                listeningText.classList.remove('show');
                voiceMic.classList.remove('listening');
                state.isListening = false;
                handleVoiceSubmit(final);
            } else if (interim) {
                voiceTextarea.value = interim;
            }
        };

        recognition.onerror = function(event) {
            console.warn('语音识别错误:', event.error);
            listeningText.classList.remove('show');
            voiceMic.classList.remove('listening');
            state.isListening = false;
            voiceTextarea.placeholder = '未能识别，请手动输入...';
            if (event.error === 'not-allowed') {
                alert('请允许浏览器使用麦克风权限。');
            }
        };

        recognition.onend = function() {
            listeningText.classList.remove('show');
            voiceMic.classList.remove('listening');
            state.isListening = false;
            if (!voiceTextarea.value.trim()) {
                voiceTextarea.placeholder = '未听清，请再试一次或手动输入...';
            }
        };

        return recognition;
    }

    voiceMic.addEventListener('click', function(e) {
        e.stopPropagation();
        if (state.isListening) {
            if (state.recognition) {
                state.recognition.abort();
                state.isListening = false;
                voiceMic.classList.remove('listening');
                listeningText.classList.remove('show');
            }
            return;
        }

        if (!state.recognition) {
            state.recognition = initSpeechRecognition();
            if (!state.recognition) return;
        }

        voiceTextarea.value = '';
        voiceTextarea.placeholder = '🎤 正在聆听...';
        try {
            state.recognition.start();
        } catch (err) {
            state.recognition.abort();
            setTimeout(() => {
                state.recognition.start();
            }, 100);
        }
    });

    async function handleVoiceSubmit(text) {
        const input = text || voiceTextarea.value.trim();
        if (!input) {
            voiceTextarea.placeholder = '请写下或说出你的心声...';
            voiceTextarea.focus();
            return;
        }

        listeningText.classList.add('show');
        voiceSubmit.disabled = true;
        voiceSubmit.textContent = '⏳ 命运倾听中...';

        let sortedIndices;
        try {
            sortedIndices = await getAISortedIndices(input);
        } catch (err) {
            console.warn('AI 匹配失败，使用降级方案');
            sortedIndices = getSynonymSortedIndices(input);
        }

        state.voiceSession.active = true;
        state.voiceSession.query = input;
        state.voiceSession.answerIndices = sortedIndices;
        state.voiceSession.currentIndex = 0;
        state.voiceSession.pageCount = 0;
        state.eggTriggerThreshold = Math.floor(Math.random() * 3) + 5;

        voiceOverlay.classList.remove('show');
        listeningText.classList.remove('show');
        voiceSubmit.disabled = false;
        voiceSubmit.textContent = '✦ 聆听';

        openFirstAnswer();
        vibrate(30);
    }

    voiceSubmit.addEventListener('click', function(e) {
        e.stopPropagation();
        if (voiceSubmit.disabled) return;
        handleVoiceSubmit();
    });

    voiceTextarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (voiceSubmit.disabled) return;
            handleVoiceSubmit();
        }
    });

    voiceClose.addEventListener('click', function(e) {
        e.stopPropagation();
        closeVoiceOverlay();
    });

    voiceOverlay.addEventListener('click', function(e) {
        if (e.target === voiceOverlay) {
            closeVoiceOverlay();
        }
    });

    // ================================================================
    // 主点击
    // ================================================================
    document.getElementById('container').addEventListener('click', function(e) {
        if (e.target.closest('#voice-overlay')) return;

        if (state.isEggMode) {
            resetEggAnimation();
            return;
        }

        if (state.isBookOpen && state.voiceSession.active) {
            turnNextAnswer();
            return;
        }

        openVoiceOverlay();
    });

    // ================================================================
    // 初始化
    // ================================================================
    async function init() {
        document.getElementById('version').textContent = APP_VERSION;
        setStatus('⏳ 正在初始化...', '');

        state.isFlipping = false;
        state.isBookOpen = false;
        state.isEggMode = false;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        state.eggMessage = '';
        state.voiceSession.active = false;
        state.voiceSession.answerIndices = [];
        state.voiceSession.currentIndex = 0;
        state.voiceSession.pageCount = 0;
        state.eggTriggerThreshold = Math.floor(Math.random() * 3) + 5;
        state.recognition = null;
        state.isListening = false;
        state.aiReady = false;
        state.answerEmbeddings = null;

        book.classList.remove('flipped');
        frontHint.textContent = '✦ 轻触书封，倾诉心声 ✦';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';

        updateBackContent('深渊在凝视你', '⛵', 0);
        back.classList.remove('flip');

        // 加载 AI（使用国内镜像）
        loadAI();

        console.log(`📖 失物之书 ${APP_VERSION} 已加载（共 ${ANSWERS.length} 条答案）`);
        console.log(`🎯 彩蛋将在第 ${state.eggTriggerThreshold} 次翻页时触发`);
    }

    init();
</script>
</body>
</html>
