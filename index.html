<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>失物之书 · 飞翔的荷兰人号</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            width:100vw; height:100vh; overflow:hidden;
            background:#0a0e1a;
            display:flex; justify-content:center; align-items:center;
            font-family:'Georgia','Times New Roman',serif;
            touch-action:manipulation;
        }
        #container {
            position:relative; width:100%; height:100%;
            max-width:480px; max-height:860px;
            background:radial-gradient(ellipse at center,#1b2540 0%,#0a0e1a 100%);
            overflow:hidden;
            display:flex; justify-content:center; align-items:center;
            cursor:pointer;
            touch-action:manipulation;
        }
        #bg-water {
            position:absolute; bottom:0; left:0; width:100%; height:40%;
            background:linear-gradient(180deg,transparent,rgba(10,30,60,0.6));
            pointer-events:none; z-index:0;
        }
        #book-wrapper {
            position:relative; z-index:1;
            width:88%; max-width:400px;
            aspect-ratio:0.72/1;
            perspective:1600px;
        }
        #book {
            position:relative; width:100%; height:100%;
            transform-style:preserve-3d;
            transition:transform 0.7s cubic-bezier(0.3,0.2,0.2,0.8);
            transform:rotateY(0deg);
            border-radius:4px 14px 14px 4px;
        }
        #book.flipped { transform:rotateY(180deg); }

        #front {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background:linear-gradient(145deg,#4a3728,#2d1f14);
            box-shadow:-10px 10px 40px rgba(0,0,0,0.9), inset -2px 0 30px rgba(0,0,0,0.3), inset 0 0 80px rgba(180,140,100,0.06);
            backface-visibility:hidden;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            padding:20px;
            border:2px solid #6a4f38;
            z-index:2;
        }
        #front::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background-image:radial-gradient(ellipse at 30% 40%,rgba(200,170,130,0.05) 0%,transparent 60%),
                repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px);
            pointer-events:none;
        }
        #front .corner {
            position:absolute; width:26px; height:26px;
            border:2px solid #b89870; opacity:0.5;
        }
        #front .corner-tl { top:10px; left:10px; border-right:none; border-bottom:none; }
        #front .corner-tr { top:10px; right:10px; border-left:none; border-bottom:none; }
        #front .corner-bl { bottom:10px; left:10px; border-right:none; border-top:none; }
        #front .corner-br { bottom:10px; right:10px; border-left:none; border-top:none; }
        #front .spine-line {
            position:absolute; left:14px; top:15%; width:2px; height:70%;
            background:linear-gradient(180deg,transparent,rgba(180,150,110,0.2),transparent);
        }
        #front .title {
            font-size:2.6rem; font-weight:bold; color:#d4b48a;
            text-shadow:0 0 40px rgba(180,150,110,0.15),0 2px 4px rgba(0,0,0,0.8);
            letter-spacing:14px; font-family:'Georgia',serif;
            margin-bottom:4px; text-align:center;
        }
        #front .subtitle {
            font-size:0.75rem; color:#8a7a6a; letter-spacing:6px;
            text-shadow:0 1px 3px rgba(0,0,0,0.6); font-style:italic;
            border-top:1px solid rgba(180,150,110,0.15);
            padding-top:12px; margin-top:4px;
        }
        #front .ornament {
            font-size:3.2rem; color:rgba(180,150,110,0.2);
            margin:6px 0; letter-spacing:16px;
        }
        #front .hint {
            position:absolute; bottom:22px; left:0; width:100%; text-align:center;
            font-size:0.65rem; color:rgba(180,170,160,0.25);
            letter-spacing:2px; animation:pulseHint 3s infinite;
        }
        @keyframes pulseHint { 0%,100%{opacity:0.15;} 50%{opacity:0.6;} }
        #front.preset-active::after {
            content: '';
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180,150,110,0.15), transparent);
            pointer-events: none;
            opacity: 0.5;
        }

        #back {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background:linear-gradient(170deg,#f5ede0,#e8dcc8);
            box-shadow:inset 0 0 60px rgba(160,130,100,0.15);
            backface-visibility:hidden;
            transform:rotateY(180deg);
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            padding:24px 18px;
            border:1px solid #c8b898;
            overflow:hidden;
        }
        #back::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:4px 14px 14px 4px;
            background-image:radial-gradient(ellipse at 20% 30%,rgba(200,170,130,0.08) 0%,transparent 50%),
                repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(180,160,130,0.03) 3px,rgba(180,160,130,0.03) 4px);
            pointer-events:none;
        }
        /* 内容初始完全隐藏，由 flip 类触发动画 */
        #back .icon,
        #back .answer {
            opacity: 0;
            transform: scale(0.8) translateY(10px);
        }
        #back .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        #back .answer {
            font-size: 1.3rem;
            line-height: 1.9;
            color: #2d241a;
            text-align: center;
            font-family: 'Georgia', serif;
            letter-spacing: 0.5px;
            padding: 0 6px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
        #back .page-number {
            position:absolute; bottom:16px; right:22px;
            font-size:0.65rem; color:#b0a090;
            letter-spacing:2px; font-style:italic;
            opacity:0.5;
        }
        #back::after {
            content:''; position:absolute; bottom:0; left:0; width:100%; height:6px;
            background:linear-gradient(0deg,#4a3728,transparent);
            border-radius:0 0 4px 14px; opacity:0.3;
        }

        /* 翻页动画：内容渐显 */
        #back.flip .icon {
            animation: iconFlip 0.5s ease forwards;
        }
        #back.flip .answer {
            animation: textFlip 0.6s ease forwards;
        }
        @keyframes iconFlip {
            0%   { opacity: 0; transform: scale(0.7) rotate(-10deg); }
            60%  { opacity: 0.6; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
        }
        @keyframes textFlip {
            0%   { opacity: 0; transform: translateY(15px) scale(0.9); }
            70%  { opacity: 0.5; transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        #egg-float {
            position:absolute; top:50%; left:50%;
            transform:translate(-50%,-50%) scale(0.9);
            z-index:20;
            color:#d4c4b0;
            font-size:1.4rem; font-family:'Georgia',serif; font-style:italic;
            letter-spacing:2px;
            text-shadow:0 0 60px rgba(180,150,110,0.3),0 4px 20px rgba(0,0,0,0.6);
            text-align:center;
            padding:20px 30px;
            background:rgba(10,14,26,0.5);
            backdrop-filter:blur(6px);
            border-radius:8px;
            border:1px solid rgba(180,150,110,0.2);
            opacity:0; pointer-events:none;
            width:80%; max-width:300px; line-height:1.6;
        }
        #egg-float .sub {
            display:block; font-size:0.7rem; color:#6a5a4a;
            margin-top:12px; letter-spacing:4px; font-style:normal;
        }

        #status {
            position:absolute; bottom:24px; left:0; width:100%; text-align:center;
            z-index:5; font-size:0.6rem; color:rgba(180,170,160,0.2);
            letter-spacing:3px; pointer-events:none;
        }
        #status span {
            background:rgba(10,14,26,0.3);
            padding:4px 14px; border-radius:20px;
            backdrop-filter:blur(2px);
        }

        @media (max-width:380px) {
            #book-wrapper { max-width:300px; }
            #front .title { font-size:2rem; letter-spacing:10px; }
            #back .answer { font-size:1.1rem; }
            #back .icon { font-size:2.2rem; }
            #egg-float { font-size:1.1rem; width:85%; }
        }
        @media (orientation:landscape) and (max-height:500px) {
            #book-wrapper { max-width:220px; }
            #front .title { font-size:1.6rem; letter-spacing:6px; }
            #back .answer { font-size:0.95rem; }
            #back .icon { font-size:2rem; }
            #egg-float { font-size:1rem; width:70%; }
        }
    </style>
</head>
<body>

<div id="container">
    <div id="bg-water"></div>
    <div id="book-wrapper">
        <div id="book">
            <div id="front">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="spine-line"></div>
                <div class="ornament">⚓</div>
                <div class="title">失物之书</div>
                <div class="subtitle">— 寻回遗失之物 —</div>
                <div class="hint">✦ 轻触书封 ✦</div>
            </div>
            <div id="back">
                <div class="icon" id="answer-icon">⛵</div>
                <div class="answer" id="answer-text">深渊在凝视你</div>
                <div class="page-number" id="page-num">— 第 ? 页 —</div>
            </div>
        </div>
    </div>
    <div id="egg-float">
        <span id="egg-text">潮水带走了这一页</span>
        <span class="sub">✦ 书已合 ✦</span>
    </div>
    <div id="status"><span id="status-text">沉睡于深海</span></div>
</div>

<script>
    // ================================================================
    //  1. 数据
    // ================================================================
    const ANSWERS = [
        "浓雾终将散开，但别急。","扬起你的主帆，风会来。","深渊正在注视着你，别回头。",
        "等待满月之夜，那时门会打开。","你的心脏还在跳动，虽然它已冰冷。",
        "转向逆风的方向，那里有出口。","旧日的锁链，无法被海水冲断。",
        "真正的宝藏，就藏在你脚下。","灯塔已经熄灭，你要自己发光。",
        "抛下你的锚，就在这里停泊。","海浪会替你回答所有问题。",
        "今夜，你可以靠岸，但只此一次。","你的船员尚未安息，你再等等。",
        "罗盘指向的不是北方，是你自己。","风暴是你唯一忠实的朋友。",
        "那片海域没有名字，正如你的命运。","你早已知道答案，何须问我。",
        "挥剑斩断过去，或者斩断自己。","把心脏装回胸膛，还来得及。",
        "继续航行，千万别回头。","深渊之眼已经睁开了。",
        "收起你的悲伤，那是累赘。","这是永恒的契约，不可违背。",
        "听，船钟在响，那是倒计时。","前方有暗礁，但也是屏障。",
        "相信那只海鸥，它是信使。","你背负着所有灵魂的重量。",
        "忘掉故乡的港口，你回不去了。","现在，开始划桨，别停。",
        "海面下藏着你遗忘的秘密。","你的命运早已写在水面上。",
        "旋转舵轮，往左打满。","火光会指引你，但那是鬼火。",
        "吞下那颗蓝色的珠子，别怕。","要么沉没，要么就此重生。",
        "黎明前的那刻最黑暗。","你在寻找的，也在深渊里寻找你。",
        "向海神放下一枚金币。","敬所有船员一杯朗姆酒。",
        "旧海图上没有这条路。","你的名字，早已刻在龙骨上。",
        "不要相信过于平静的海面。","风停了，就耐心等风来。",
        "孤独是你唯一的战利品。","船灵正在甲板下低语。",
        "往正北走三海里，仔细看。","那里有一扇沉没的大门。",
        "锁上它，或者勇敢地打开它。","你的恐惧，正是船帆的动力。",
        "千万别触碰那根生锈的锁链。","深渊正在回应你的呼唤。",
        "放下复仇的念头，那是毒药。","去寻找那只会说话的海蛇。",
        "你的影子，正挂在船尾晾干。","立即改道，避开那片漩涡。",
        "答案写在浪花的泡沫里。","举起你的佩剑，向黑暗宣誓。",
        "号角已经吹响，该行动了。","这不是终点，只是换了个方向。",
        "海水已经浸透了你的骨骼。","但你依然活着，这就够了。",
        "触碰那盏摇曳的灯笼。","它会照亮漆黑的水底。",
        "你丢失了一半的灵魂。","另一半，被留在了岸上。",
        "随便选一个方向，都是对的。","诅咒的力量正在慢慢减弱。",
        "除非你现在就选择回头。","今日适合向海神献祭。",
        "把那枚银币投入海中。","雾里有声音在叫你名字。",
        "千万别轻易回应它。","那是海妖的诡计，别上当。",
        "闭上眼，看看你的内心。","那里的海面永远平静如镜。",
        "你的船员们已经原谅了你。","烧掉那张泛黄的羊皮纸。",
        "灰烬中会浮现真正的真相。","潮汐将在午夜时分转向。",
        "准备好你的缆绳。","这一次，真的可以靠岸了。",
        "除非这只是一场漫长的梦。","检查你的罗盘，它在疯狂旋转。",
        "你正处在风暴的正中心。","这是整个海域最安全的地方。",
        "等待黎明的第一声号角。","你的心脏就在左舷水底。",
        "潜下去，它就在那里等你。","水很深，但你必须敢。",
        "你是一位好船长。","船员们不会承认，但这是真的。",
        "带着这份荣耀继续航行。","或者带着所有秘密沉下去。",
        "今晚的月亮正在看着你。","她在为你悄悄指引方向。",
        "这就是命运给你的答案。","你的船，其实早已靠岸了。",
        "但这趟伟大的旅程，才刚刚开始。","倾听海水的声音，那即是真理。",
        "飞翔的荷兰人号，永远与你同在。"
    ];
    const ICONS = ['⛵','🗺️','🧭','⚓','🏴‍☠️','🔱','🐚','🌊','📜','🌙','⭐','🕯️'];
    const RANDOM_EGG_MESSAGES = [
        "有些宝藏，不在今日。","潮水带走了这一页。","风停了，书也倦了。",
        "浪花抹去了字迹。","海雾太重，看不清了。","月亮藏进了云里。",
        "你找的，或许在下一片海域。","不是每颗星辰都在今夜坠落。",
        "深渊说：你已问得够多了。","真正的答案，从不在翻开的这一页。",
        "你翻得越快，它藏得越深。","松开手，它自然会浮上来。",
        "有时候，找不到才是对的。","别急。海很大，书也很厚。",
        "它在你背后，你一直没回头。","书页在呼吸，你听见了吗？",
        "它认得你。它在躲你。","你还没准备好看见它。",
        "这一页是空白的。等你来写。","船在等你。书也在等你。"
    ];
    const PRESET_ANSWERS = [
        "那是海妖的诡计，别上当。",
        "检查你的罗盘，它在疯狂旋转。",
        "灯塔已经熄灭，你要自己发光。",
        "这一次，真的可以靠岸了。",
        "你早已知道答案，何须问我。"
    ];
    const PRESET_EGG = "你翻得越快，它藏得越深。";

    // ================================================================
    //  2. 音效
    // ================================================================
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }
    function playPageSound() {
        try {
            const ctx = getAudioCtx();
            const size = ctx.sampleRate * 0.10;
            const buf = ctx.createBuffer(1, size, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < size; i++) {
                const t = i / size;
                d[i] = (Math.random() * 2 - 1) * (1 - t) * 0.12 + Math.sin(i * 0.008) * (1 - t) * 0.03;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const gain = ctx.createGain();
            gain.gain.value = 0.35;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(ctx.currentTime);
        } catch (_) {}
    }
    function playCloseSound() {
        try {
            const ctx = getAudioCtx();
            const size = ctx.sampleRate * 0.25;
            const buf = ctx.createBuffer(1, size, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < size; i++) {
                const t = i / size;
                const decay = Math.exp(-t * 6);
                d[i] = (Math.random() * 2 - 1) * decay * 0.25 + Math.sin(i * 0.02) * decay * 0.08 + Math.sin(i * 0.05 + 0.5) * decay * 0.05;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const gain = ctx.createGain();
            gain.gain.value = 0.5;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(ctx.currentTime);
        } catch (_) {}
    }

    // ================================================================
    //  3. DOM
    // ================================================================
    const book = document.getElementById('book');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const answerText = document.getElementById('answer-text');
    const answerIcon = document.getElementById('answer-icon');
    const pageNum = document.getElementById('page-num');
    const eggFloat = document.getElementById('egg-float');
    const eggText = document.getElementById('egg-text');
    const statusText = document.getElementById('status-text');
    const frontHint = document.querySelector('#front .hint');

    // ================================================================
    //  4. 统一状态
    // ================================================================
    const state = {
        isFlipping: false,
        isBookOpen: false,
        pageCount: 0,
        isEggMode: false,
        eggAnimId: null,
        eggMessage: '',
        randomEggTrigger: Math.floor(Math.random() * 6) + 5,

        presetMode: false,
        presetStep: 0,

        longPressTimer: null,
        longPressTriggered: false,
        longPressDuration: 800,
    };

    // ================================================================
    //  5. 工具函数
    // ================================================================
    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomAnswer() { return rand(ANSWERS); }
    function getRandomIcon() { return rand(ICONS); }
    function getRandomPage() { return Math.floor(Math.random() * 300) + 1; }
    function getRandomEgg() { return rand(RANDOM_EGG_MESSAGES); }

    function vibrate(duration = 50) {
        try { if (navigator.vibrate) navigator.vibrate(duration); } catch (_) {}
    }

    // 更新内容，不改变任何样式（由 CSS 控制显隐）
    function updateBackContent(text, icon, page) {
        answerText.textContent = text || getRandomAnswer();
        answerIcon.textContent = icon || getRandomIcon();
        pageNum.textContent = `— 第 ${page || getRandomPage()} 页 —`;
    }

    function getCurrentAnswer() {
        if (state.presetMode) {
            if (state.presetStep >= 1 && state.presetStep <= 5) {
                const idx = state.presetStep - 1;
                return { text: PRESET_ANSWERS[idx], icon: '⚓', page: state.presetStep };
            } else {
                return { text: getRandomAnswer(), icon: getRandomIcon(), page: getRandomPage() };
            }
        } else {
            return { text: getRandomAnswer(), icon: getRandomIcon(), page: getRandomPage() };
        }
    }

    // ================================================================
    //  6. 核心翻页（无闪烁版）
    // ================================================================
    function performTurn(beforeOpen, afterOpen) {
        if (state.isFlipping) return;
        state.isFlipping = true;

        // 1. 先移除 flip 类，确保内容隐藏
        back.classList.remove('flip');

        // 2. 合拢书本（如果已经翻开则合拢）
        book.classList.remove('flipped');
        state.isBookOpen = false;
        playCloseSound();

        // 3. 等待合拢动画完成（400ms）
        setTimeout(() => {
            // 4. 更新内容（此时内容仍隐藏，因为没有 flip 类）
            if (beforeOpen) beforeOpen();

            // 5. 翻开书本
            book.classList.add('flipped');
            state.isBookOpen = true;
            playPageSound();

            // 6. 等待翻转动画完成（700ms 后）
            setTimeout(() => {
                // 7. 现在添加 flip 类触发入场动画
                back.classList.add('flip');
                if (afterOpen) afterOpen();
                state.isFlipping = false;
            }, 300); // 与 CSS transition 时长一致
        }, 400);
    }

    function openBook() {
        if (state.isFlipping || state.isEggMode) return;

        if (state.presetMode && state.presetStep === 0) {
            state.presetStep = 1;
        }
        const ans = getCurrentAnswer();
        state.pageCount = state.presetMode ? state.presetStep : 1;

        performTurn(
            function() {
                updateBackContent(ans.text, ans.icon, ans.page);
            },
            function() {
                statusText.textContent = `✦ 第 ${state.pageCount} 页 ✦`;
                frontHint.textContent = '✦ 翻页继续 ✦';
            }
        );
    }

    function turnPage() {
        if (state.isFlipping || state.isEggMode) return;
        if (!state.isBookOpen) return;

        // 普通模式彩蛋触发
        if (!state.presetMode) {
            if (state.pageCount >= state.randomEggTrigger) {
                enterEggMode();
                return;
            }
        }

        // 预设模式彩蛋触发
        if (state.presetMode) {
            if (state.presetStep === 6) {
                enterEggMode();
                return;
            }
            if (state.presetStep >= 5) {
                // 合拢后直接进入彩蛋
                book.classList.remove('flipped');
                state.isBookOpen = false;
                frontHint.textContent = '✦ 潮退后再来 ✦';
                statusText.textContent = '🌊 书已合';
                state.presetStep = 6;
                setTimeout(() => {
                    enterEggMode();
                }, 400);
                return;
            }
        }

        // 正常翻页
        if (state.presetMode) {
            state.presetStep++;
        }
        const ans = getCurrentAnswer();
        state.pageCount = state.presetMode ? state.presetStep : state.pageCount + 1;

        performTurn(
            function() {
                updateBackContent(ans.text, ans.icon, ans.page);
            },
            function() {
                statusText.textContent = `✦ 第 ${state.pageCount} 页 ✦`;
                frontHint.textContent = '✦ 翻页继续 ✦';
            }
        );
    }

    // ================================================================
    //  7. 彩蛋模式（保持不变）
    // ================================================================

    function enterEggMode() {
        if (state.isEggMode) {
            resetEggAnimation();
            return;
        }

        state.isEggMode = true;
        playCloseSound();

        book.classList.remove('flipped');
        state.isBookOpen = false;
        frontHint.textContent = '✦ 潮退后再来 ✦';
        statusText.textContent = '🌊 书已合';

        state.eggMessage = state.presetMode ? PRESET_EGG : getRandomEgg();
        startEggAnimation(state.eggMessage);
    }

    function startEggAnimation(text) {
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }

        eggText.textContent = text;
        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-40%) scale(0.9)';
        void eggFloat.offsetHeight;

        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '1';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(1)';
        void eggFloat.offsetHeight;

        let startTime = null;
        const duration = 2800;
        const endY = -40;

        function animateEgg(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 1.5);
            const currentY = endY * eased;
            const currentOpacity = 1 - eased * 0.9;

            eggFloat.style.transition = 'none';
            eggFloat.style.transform = `translate(-50%, calc(-50% + ${currentY}px)) scale(${1 - eased * 0.05})`;
            eggFloat.style.opacity = currentOpacity;

            if (progress < 1) {
                state.eggAnimId = requestAnimationFrame(animateEgg);
            } else {
                eggFloat.style.opacity = '0';
                eggFloat.style.transform = 'translate(-50%, calc(-50% + 40px)) scale(0.9)';
                state.eggAnimId = null;
            }
        }

        state.eggAnimId = requestAnimationFrame(animateEgg);
    }

    function resetEggAnimation() {
        if (!state.isEggMode) return;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        eggFloat.style.transition = 'none';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';
        startEggAnimation(state.eggMessage);
    }

    function exitEggMode() {
        if (!state.isEggMode) return;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';
        state.isEggMode = false;
        if (!state.presetMode) {
            state.pageCount = 0;
            state.randomEggTrigger = Math.floor(Math.random() * 6) + 5;
        }
        frontHint.textContent = '✦ 轻触书封 ✦';
        statusText.textContent = '沉睡于深海';
    }

    // ================================================================
    //  8. 预设模式切换
    // ================================================================

    function togglePresetMode() {
        if (state.presetMode) {
            state.presetMode = false;
            state.presetStep = 0;
            if (state.isEggMode) exitEggMode();
            book.classList.remove('flipped');
            state.isBookOpen = false;
            frontHint.textContent = '✦ 轻触书封 ✦';
            statusText.textContent = '沉睡于深海';
            front.classList.remove('preset-active');
            state.pageCount = 0;
            state.randomEggTrigger = Math.floor(Math.random() * 6) + 5;
            vibrate(60);
        } else {
            state.presetMode = true;
            state.presetStep = 0;
            if (state.isEggMode) exitEggMode();
            book.classList.remove('flipped');
            state.isBookOpen = false;
            frontHint.textContent = '✦ 轻触书封 ✦';
            statusText.textContent = '⚓ 命运已就绪';
            front.classList.add('preset-active');
            vibrate(60);
        }
    }

    // ================================================================
    //  9. 长按检测
    // ================================================================
    front.addEventListener('pointerdown', function(e) {
        const rect = front.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const w = rect.width;
        const h = rect.height;
        const cornerSize = 0.3;
        const isRightCorner = x > w * (1 - cornerSize) && y > h * (1 - cornerSize);
        if (!isRightCorner) return;

        if (state.longPressTimer) clearTimeout(state.longPressTimer);
        state.longPressTriggered = false;
        state.longPressTimer = setTimeout(() => {
            state.longPressTriggered = true;
            togglePresetMode();
            state.longPressTimer = null;
        }, state.longPressDuration);
    });

    front.addEventListener('pointerup', function(e) {
        if (state.longPressTimer) {
            clearTimeout(state.longPressTimer);
            state.longPressTimer = null;
        }
        if (state.longPressTriggered) {
            state.longPressTriggered = false;
            e.stopPropagation();
        }
    });
    front.addEventListener('pointercancel', function() {
        if (state.longPressTimer) {
            clearTimeout(state.longPressTimer);
            state.longPressTimer = null;
        }
        state.longPressTriggered = false;
    });

    // ================================================================
    //  10. 主点击事件
    // ================================================================
    document.getElementById('container').addEventListener('click', function(e) {
        if (state.longPressTriggered) {
            state.longPressTriggered = false;
            return;
        }

        if (state.isEggMode) {
            resetEggAnimation();
            return;
        }

        if (!state.isBookOpen) {
            openBook();
        } else {
            turnPage();
        }
    });

    // ================================================================
    //  11. 初始化
    // ================================================================
    function init() {
        state.isFlipping = false;
        state.isBookOpen = false;
        state.pageCount = 0;
        state.randomEggTrigger = Math.floor(Math.random() * 6) + 5;
        state.isEggMode = false;
        if (state.eggAnimId) {
            cancelAnimationFrame(state.eggAnimId);
            state.eggAnimId = null;
        }
        state.eggMessage = '';
        state.presetMode = false;
        state.presetStep = 0;
        state.longPressTimer = null;
        state.longPressTriggered = false;

        book.classList.remove('flipped');
        front.classList.remove('preset-active');
        frontHint.textContent = '✦ 轻触书封 ✦';
        statusText.textContent = '沉睡于深海';
        eggFloat.style.opacity = '0';
        eggFloat.style.transform = 'translate(-50%,-50%) scale(0.9)';

        updateBackContent('深渊在凝视你', '⛵', 0);
        back.classList.remove('flip');

        console.log('📖 失物之书已加载');
        console.log(`🎯 普通模式彩蛋将在第 ${state.randomEggTrigger} 次翻开时触发`);
        console.log('🔮 长按封面右下角0.8秒切换预设模式');
        console.log('📋 预设答案:', PRESET_ANSWERS);
        console.log(`   🥚 彩蛋: ${PRESET_EGG}`);
        console.log('💡 彩蛋触发后，点击书本即可重置彩蛋动画（内容不变）');
    }

    init();
</script>
</body>
